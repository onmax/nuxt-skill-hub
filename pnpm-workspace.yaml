packages:
  - '.'
  - 'docs'

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true
  vue-demi: true

catalogs:
  runtime:
    automd: ^0.4.3
    mlly: ^1.8.2
    unagent: ^0.0.8
  nuxt:
    '@nuxt/devtools': ^3.4.4
    '@nuxt/eslint-config': ^1.17.0
    '@nuxt/kit': ^4.4.6
    '@nuxt/module-builder': ^1.0.3
    '@nuxt/schema': ^4.6.2
    '@nuxt/test-utils': ^4.3.4
    nuxt: ^4.6.2
  quality:
    '@types/node': ^24.19.2
    '@vue/test-utils': ^2.5.1
    eslint: ^10.13.0
    happy-dom: ^21.0.4
    typescript: ~6.0.3
    vitest: ^5.0.5
    vue-tsc: ^3.3.13
  frontend:
    '@nuxt/ui': ^4.12.0
    '@resvg/resvg-js': ^2.6.2
    nuxt-og-image: ^6.5.1
    satori: ^0.26.0
    tailwindcss: ^4.3.3
    vue: ^3.5.44
  auth:
    '@onmax/nuxt-better-auth': 0.0.2-alpha.29
    better-auth: ^1.6.13
  cloud:
    '@nuxthub/core': ^0.10.7
